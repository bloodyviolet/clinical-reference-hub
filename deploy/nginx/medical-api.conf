# Install inside nginx's http{} context (e.g. /etc/nginx/conf.d/medical-api.conf).
# Replace __MEDICAL_API_HOST__ and TLS certificate paths before enabling.
limit_req_zone $binary_remote_addr zone=medical_api_general:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=medical_api_search:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __MEDICAL_API_HOST__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __MEDICAL_API_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__MEDICAL_API_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__MEDICAL_API_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;

    # nginx is authoritative for HSTS so upstream errors receive it too.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64k;
    limit_req_status 429;

    # Health monitors must not consume the public API rate budget.
    location = /api/v1/livez { include /etc/nginx/snippets/medical-api-proxy.conf; }
    location = /api/v1/readyz { include /etc/nginx/snippets/medical-api-proxy.conf; }
    location = /api/v1/healthz { include /etc/nginx/snippets/medical-api-proxy.conf; }

    location = /api/v1/sae/search {
        limit_req zone=medical_api_search burst=20 nodelay;
        include /etc/nginx/snippets/medical-api-proxy.conf;
    }
    location = /sae/search {
        limit_req zone=medical_api_search burst=20 nodelay;
        include /etc/nginx/snippets/medical-api-proxy.conf;
    }

    location /api/ {
        limit_req zone=medical_api_general burst=40 nodelay;
        include /etc/nginx/snippets/medical-api-proxy.conf;
    }
    location /sae/ {
        limit_req zone=medical_api_general burst=40 nodelay;
        include /etc/nginx/snippets/medical-api-proxy.conf;
    }
    location /policy/ {
        limit_req zone=medical_api_general burst=40 nodelay;
        include /etc/nginx/snippets/medical-api-proxy.conf;
    }
    location = /pnaism/ {
        limit_req zone=medical_api_general burst=40 nodelay;
        include /etc/nginx/snippets/medical-api-proxy.conf;
    }

    location / { include /etc/nginx/snippets/medical-api-proxy.conf; }
}
